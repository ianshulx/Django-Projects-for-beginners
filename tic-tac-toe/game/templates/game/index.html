<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #1a1a2e;
        color: white;
      }
      .container {
        text-align: center;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        color: #e94560;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, 120px);
        grid-template-rows: repeat(3, 120px);
        gap: 10px;
        margin: 20px auto;
      }
      .cell {
        background-color: #16213e;
        border: 2px solid #e94560;
        border-radius: 10px;
        font-size: 3rem;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.2s;
      }
      .cell:hover {
        background-color: #0f3460;
      }
      .status {
        font-size: 1.5rem;
        margin: 15px 0;
        color: #e94560;
      }
      button {
        padding: 10px 30px;
        font-size: 1rem;
        background-color: #e94560;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover {
        background-color: #c73652;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Tic Tac Toe</h1>
      <div class="status" id="status">
        {% if winner %} 🎉 Player {{ winner }} জিতেছে! {% elif draw %} 🤝 Draw
        হয়েছে! {% else %} Player {{ current_player }}-এর পালা {% endif %}
      </div>
      <div class="board" id="board">
        {% for cell in board %}
        <div class="cell" onclick="makeMove({{ forloop.counter0 }})">
          {{ cell }}
        </div>
        {% endfor %}
      </div>
      <button onclick="resetGame()">🔄 New Game</button>
    </div>

    <script>
      function makeMove(position) {
        fetch("/move/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ position: position }),
        })
          .then((res) => res.json())
          .then((data) => {
            updateBoard(data);
          });
      }

      function resetGame() {
        fetch("/reset/")
          .then((res) => res.json())
          .then(() => location.reload());
      }

      function updateBoard(data) {
        const cells = document.querySelectorAll(".cell");
        cells.forEach((cell, i) => {
          cell.textContent = data.board[i];
        });

        const status = document.getElementById("status");
        if (data.winner) {
          status.textContent = "🎉 Player " + data.winner + " জিতেছে!";
        } else if (data.draw) {
          status.textContent = "🤝 Draw হয়েছে!";
        } else {
          status.textContent = "Player " + data.current_player + "-এর পালা";
        }
      }
    </script>
  </body>
</html>
