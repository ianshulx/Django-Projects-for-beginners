<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }

      .container {
        text-align: center;
        padding: 20px;
      }

      h1 {
        font-size: 3rem;
        font-weight: 800;
        background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
        letter-spacing: 2px;
      }

      .scoreboard {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 15px 0;
      }

      .score-box {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 15px;
        padding: 12px 25px;
        font-size: 1.1rem;
        transition: transform 0.3s;
      }

      .score-box:hover {
        transform: scale(1.05);
      }
      .score-box span {
        font-size: 1.8rem;
        font-weight: bold;
        display: block;
      }
      .score-box.x span {
        color: #ff6b6b;
      }
      .score-box.draw span {
        color: #feca57;
      }
      .score-box.o span {
        color: #48dbfb;
      }

      .status {
        font-size: 1.4rem;
        margin: 15px 0;
        padding: 10px 25px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 30px;
        display: inline-block;
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: all 0.3s;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 120px);
        grid-template-rows: repeat(3, 120px);
        gap: 12px;
        margin: 20px auto;
        width: fit-content;
      }

      .cell {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        font-size: 3.5rem;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.2s;
        position: relative;
        overflow: hidden;
      }

      .cell:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: scale(1.05);
        border-color: rgba(255, 255, 255, 0.4);
      }

      .cell.x {
        color: #ff6b6b;
        text-shadow: 0 0 20px #ff6b6b;
      }
      .cell.o {
        color: #48dbfb;
        text-shadow: 0 0 20px #48dbfb;
      }

      .cell.winning {
        animation: winPulse 0.6s ease infinite alternate;
        border-color: #feca57;
        background: rgba(254, 202, 87, 0.2);
      }

      @keyframes winPulse {
        from {
          transform: scale(1);
          box-shadow: 0 0 10px #feca57;
        }
        to {
          transform: scale(1.1);
          box-shadow: 0 0 30px #feca57;
        }
      }

      .cell.pop {
        animation: pop 0.3s ease;
      }

      @keyframes pop {
        0% {
          transform: scale(0);
        }
        70% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      .buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 20px;
      }

      button {
        padding: 12px 30px;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: all 0.3s;
        letter-spacing: 1px;
      }

      .btn-reset {
        background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        color: white;
        box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
      }

      .btn-reset:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
      }

      .btn-score-reset {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .btn-score-reset:hover {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.2);
      }

      /* Confetti */
      .confetti-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 999;
      }

      .confetti-piece {
        position: absolute;
        width: 10px;
        height: 10px;
        top: -10px;
        animation: confettiFall linear forwards;
      }

      @keyframes confettiFall {
        to {
          transform: translateY(100vh) rotate(720deg);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="confetti-container" id="confetti"></div>

    <div class="container">
      <h1>Tic Tac Toe</h1>

      <div class="scoreboard">
        <div class="score-box x">
          Player X
          <span id="scoreX">0</span>
        </div>
        <div class="score-box draw">
          Draw
          <span id="scoreDraw">0</span>
        </div>
        <div class="score-box o">
          Player O
          <span id="scoreO">0</span>
        </div>
      </div>

      <div class="status" id="status">
        {% if winner %} 🎉 Player {{ winner }} জিতেছে! {% elif draw %} 🤝 Draw
        হয়েছে! {% else %} Player {{ current_player }}-এর পালা {% endif %}
      </div>

      <div class="board" id="board">
        {% for cell in board %}
        <div
          class="cell {% if cell %}{{ cell|lower }}{% endif %}"
          onclick="makeMove({{ forloop.counter0 }})"
        >
          {{ cell }}
        </div>
        {% endfor %}
      </div>

      <div class="buttons">
        <button class="btn-reset" onclick="resetGame()">🔄 New Game</button>
        <button class="btn-score-reset" onclick="resetScore()">
          🗑️ Reset Score
        </button>
      </div>
    </div>

    <script>
      // Score
      let scores = { X: 0, O: 0, Draw: 0 };

      // Sound
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playSound(type) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === "click") {
          oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(
            600,
            audioCtx.currentTime + 0.1,
          );
          gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.1,
          );
          oscillator.start();
          oscillator.stop(audioCtx.currentTime + 0.1);
        } else if (type === "win") {
          [523, 659, 784, 1047].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.frequency.value = freq;
            g.gain.setValueAtTime(0.3, audioCtx.currentTime + i * 0.15);
            g.gain.exponentialRampToValueAtTime(
              0.01,
              audioCtx.currentTime + i * 0.15 + 0.3,
            );
            osc.start(audioCtx.currentTime + i * 0.15);
            osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
          });
        } else if (type === "draw") {
          oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
          oscillator.frequency.exponentialRampToValueAtTime(
            150,
            audioCtx.currentTime + 0.4,
          );
          gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            audioCtx.currentTime + 0.4,
          );
          oscillator.start();
          oscillator.stop(audioCtx.currentTime + 0.4);
        }
      }

      function launchConfetti() {
        const container = document.getElementById("confetti");
        container.innerHTML = "";
        const colors = ["#ff6b6b", "#feca57", "#48dbfb", "#ff9ff3", "#54a0ff"];
        for (let i = 0; i < 80; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti-piece";
          piece.style.left = Math.random() * 100 + "vw";
          piece.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
          piece.style.animationDuration = Math.random() * 2 + 1.5 + "s";
          piece.style.animationDelay = Math.random() * 1 + "s";
          container.appendChild(piece);
        }
        setTimeout(() => (container.innerHTML = ""), 4000);
      }

      function makeMove(position) {
        playSound("click");
        fetch("/move/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ position: position }),
        })
          .then((res) => res.json())
          .then((data) => updateBoard(data));
      }

      function resetGame() {
        fetch("/reset/")
          .then((res) => res.json())
          .then(() => location.reload());
      }

      function resetScore() {
        scores = { X: 0, O: 0, Draw: 0 };
        document.getElementById("scoreX").textContent = 0;
        document.getElementById("scoreO").textContent = 0;
        document.getElementById("scoreDraw").textContent = 0;
      }

      function updateBoard(data) {
        const cells = document.querySelectorAll(".cell");
        cells.forEach((cell, i) => {
          if (data.board[i] && !cell.textContent.trim()) {
            cell.textContent = data.board[i];
            cell.className = "cell " + data.board[i].toLowerCase() + " pop";
          }
        });

        const status = document.getElementById("status");

        if (data.winner) {
          status.textContent = "🎉 Player " + data.winner + " জিতেছে!";
          scores[data.winner]++;
          document.getElementById("score" + data.winner).textContent =
            scores[data.winner];
          playSound("win");
          launchConfetti();

          // Highlight winning cells
          const wins = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6],
          ];
          wins.forEach((combo) => {
            if (
              data.board[combo[0]] &&
              data.board[combo[0]] === data.board[combo[1]] &&
              data.board[combo[1]] === data.board[combo[2]]
            ) {
              combo.forEach((i) => cells[i].classList.add("winning"));
            }
          });
        } else if (data.draw) {
          status.textContent = "🤝 Draw হয়েছে!";
          scores["Draw"]++;
          document.getElementById("scoreDraw").textContent = scores["Draw"];
          playSound("draw");
        } else {
          status.textContent = "Player " + data.current_player + "-এর পালা";
        }
      }
    </script>
  </body>
</html>
