<form method="get" action="">
  <input
    type="text"
    name="search"
    placeholder="Search news..."
    value="{{ search_query }}"
  />
  <button type="submit">Search</button>
</form>

<ul>
  {% for item in news_items %}
  <li>{{ item.title }}</li>
  {% empty %}
  <li>No news found.</li>
  {% endfor %}
</ul>
